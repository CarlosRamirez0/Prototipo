name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Se a sua branch principal for 'master', mude aqui

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
      
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install LLVM/Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Compile C to WebAssembly
        # Substitua pelo caminho exato do seu arquivo js
        run: node scripts/build-wasm.js 

      - name: Build Vite
        run: npm run build